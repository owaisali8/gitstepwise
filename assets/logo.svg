<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>GPUI Editor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1D"/>
      <stop offset="0.5" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-50%" width="500%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#shine)"/>
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Gutter: added (green), modified (blue), deleted (red) -->
  <rect x="108" y="184" width="12" height="88" rx="6" fill="#4ADE80"/>
  <rect x="108" y="296" width="12" height="32" rx="6" fill="#60A5FA"/>
  <rect x="102" y="335" width="24" height="10" rx="5" fill="#F87171"/>

  <!-- Code -->
  <rect x="150" y="130" width="72" height="28" rx="14" fill="#A78BFA"/>
  <rect x="238" y="130" width="150" height="28" rx="14" fill="#E2E8F0" fill-opacity="0.85"/>

  <rect x="190" y="186" width="112" height="28" rx="14" fill="#67E8F9"/>
  <rect x="318" y="186" width="88" height="28" rx="14" fill="#E2E8F0" fill-opacity="0.85"/>

  <rect x="190" y="242" width="196" height="28" rx="14" fill="#E2E8F0" fill-opacity="0.55"/>

  <rect x="190" y="298" width="140" height="28" rx="14" fill="#FDBA74"/>
  <rect x="346" y="298" width="60" height="28" rx="14" fill="#E2E8F0" fill-opacity="0.85"/>

  <rect x="150" y="354" width="56" height="28" rx="14" fill="#E2E8F0" fill-opacity="0.85"/>

  <!-- Caret -->
  <rect x="222" y="346" width="9" height="44" rx="4.5" fill="#67E8F9" filter="url(#glow)" opacity="0.9"/>
  <rect x="222" y="346" width="9" height="44" rx="4.5" fill="#F8FAFC"/>
</svg>
