<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>GPUI Editor (small sizes)</title>
  <!-- The logo simplified for 16 to 40 px: fewer, thicker marks that stay legible. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1D"/>
      <stop offset="0.5" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Gutter: added (green), modified (blue) -->
  <rect x="88" y="120" width="40" height="168" rx="20" fill="#4ADE80"/>
  <rect x="88" y="312" width="40" height="72" rx="20" fill="#60A5FA"/>

  <!-- Code -->
  <rect x="164" y="120" width="116" height="72" rx="36" fill="#A78BFA"/>
  <rect x="300" y="120" width="124" height="72" rx="36" fill="#E2E8F0"/>
  <rect x="204" y="216" width="220" height="72" rx="36" fill="#67E8F9"/>
  <rect x="164" y="312" width="100" height="72" rx="36" fill="#FDBA74"/>

  <!-- Caret -->
  <rect x="290" y="300" width="26" height="96" rx="13" fill="#F8FAFC"/>
</svg>
