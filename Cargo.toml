[package]
name = "gitstepwise"
version = "0.1.0"
edition = "2024"

[dependencies]
# Terminal emulation and the PTY (ConPTY on Windows) for the terminal panel.
alacritty_terminal = "0.26"
futures = "0.3"
# Line diffs against the last Git commit, for the gutter and the Changes view.
similar = "3"
# Watches the repository so each edit becomes a step in the edit timeline,
# which is kept in .git as JSON until the next commit.
notify = "8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Each tree-sitter-* feature adds syntax highlighting for one language.
# JSON highlighting is built in. Add more from gpui-kit's feature list as needed.
gpui-kit = { version = "0.10", features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
trash = "5"
# Images embedded in Markdown as data: URLs, for the preview.
data-url = "0.3"

[build-dependencies]
# Embeds assets/icon.ico in the Windows .exe (see build.rs).
embed-resource = "3"
