[package]
name = "gitstepwise"
version = "0.1.0"
edition = "2024"
# Where updates come from: the releases of this repository on GitHub.
repository = "https://github.com/owaisali8/gitstepwise"

[dependencies]
# Terminal emulation and the PTY (ConPTY on Windows) for the terminal panel.
alacritty_terminal = "0.26"
futures = "0.3"
# Line diffs against the last Git commit, for the gutter and the Changes view.
similar = "3"
# Watches the repository so each edit becomes a step in the edit timeline,
# which is kept in .git as JSON until the next commit.
notify = "8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Each tree-sitter-* feature adds syntax highlighting for one language.
# JSON highlighting is built in. Add more from gpui-kit's feature list as needed.
gpui-kit = { version = "0.10", features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
trash = "5"
# Images embedded in Markdown as data: URLs, for the preview.
data-url = "0.3"
# The config folder, where the list of projects is kept.
dirs = "6"
# The credentials vault: a key made from the master password with Argon2id
# encrypts the vault with XChaCha20-Poly1305. The key is wiped from memory
# when the vault locks.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
base64 = "0.22"
# Updates: asks GitHub for the latest release, downloads it, and checks it
# against the SHA-256 digest GitHub lists for it.
ureq = { version = "3", features = ["json"] }
semver = "1"
sha2 = "0.10"

[build-dependencies]
# Embeds assets/icon.ico in the Windows .exe (see build.rs).
embed-resource = "3"

# Making the vault's key takes a moment by design; unoptimized, it would
# take several times as long in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
