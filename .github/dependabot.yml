# Weekly pull requests that update dependencies; CI tests each one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One pull request for all the minor and patch updates.
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
